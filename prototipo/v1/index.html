<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard UX · v1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="saltar" href="#main">Saltar al contenido</a>
  <header class="barra">
    <span class="marca">Dashboard UX</span>
    <nav aria-label="Migas de pan" id="migas"></nav>
    <span class="guardado" id="guardado" aria-live="polite"></span>
  </header>

  <main id="main">
    <!-- Pantalla 1: Inicio -->
    <section id="p-inicio" class="pantalla" aria-labelledby="t-inicio">
      <h1 id="t-inicio" tabindex="-1">Sesiones de prueba</h1>
      <div id="lista-sesiones" class="tarjetas"></div>
    </section>

    <!-- Pantalla 2: Sesión -->
    <section id="p-sesion" class="pantalla" aria-labelledby="t-sesion" hidden>
      <h1 id="t-sesion" tabindex="-1">Sesión P-07 · App de matrícula</h1>
      <div id="aviso" class="aviso" hidden></div>
      <div id="error" class="error" role="alert" tabindex="-1" hidden></div>

      <nav aria-label="Pasos de la prueba">
        <ol id="stepper" class="stepper"></ol>
      </nav>

      <div class="columnas">
        <form id="registro" class="card" novalidate>
          <h2 id="t-registro">Registro</h2>
          <div class="fila">
            <label>Errores <input id="f-errores" type="number" min="0" inputmode="numeric"></label>
            <label>Tiempo (min) <input id="f-tiempo" type="number" min="0" inputmode="numeric"></label>
          </div>
          <label>Observaciones <textarea id="f-obs" rows="4"></textarea></label>
          <div class="acciones">
            <button type="button" id="b-completar" class="primario">Completar paso</button>
            <button type="button" id="b-reabrir">Reabrir paso</button>
          </div>
        </form>

        <section class="card" aria-labelledby="t-check">
          <h2 id="t-check">Checklist de cierre</h2>
          <p class="nota">* obligatorio</p>
          <ul id="checklist" class="checklist"></ul>
          <div class="acciones">
            <button type="button" id="b-cerrar" class="primario">Cerrar sesión</button>
          </div>
        </section>
      </div>
    </section>

    <!-- Pantalla 3: Confirmación -->
    <section id="p-cerrada" class="pantalla" aria-labelledby="t-cerrada" hidden>
      <h1 id="t-cerrada" tabindex="-1">Sesión cerrada</h1>
      <div class="card" id="resumen"></div>
      <div class="acciones">
        <button type="button" id="b-volver" class="primario">Volver al Dashboard</button>
      </div>
    </section>
  </main>

  <div id="anuncio" class="sr" aria-live="polite"></div>
  <footer class="pie">
    Prototipo v1 · IHC-A-12 · <button type="button" id="b-reset" class="enlace">Restablecer datos de demostración</button>
  </footer>
  <script src="app.js"></script>
</body>
</html>
